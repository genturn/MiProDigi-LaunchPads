<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiProDigi LaunchPads</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #0F1C23;
      font-family: 'Nunito', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .card {
      text-align: center;
      max-width: 480px;
      width: 100%;
    }
    .logo {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }
    .logo .mi   { color: #7B5EA7; }
    .logo .pro  { color: #FFFFFF; }
    .logo .digi { color: #6AC1C3; }
    .tagline {
      font-family: 'Playfair Display', serif;
      color: rgba(255,255,255,0.5);
      font-size: 15px;
      margin-bottom: 48px;
      font-style: italic;
    }
    .message {
      color: rgba(255,255,255,0.35);
      font-size: 13px;
      line-height: 1.8;
    }
    .divider {
      width: 40px;
      height: 2px;
      background: #6AC1C3;
      margin: 0 auto 32px;
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <span class="mi">MI</span><span class="pro">PRO</span><span class="digi">DIGI</span>
    </div>
    <p class="tagline">Business Operations Hubs</p>
    <div class="divider"></div>
    <p class="message">Your personalized workspace is ready.<br>Use the link provided to you to access your hub.</p>
  </div>
</body>
</html>
